[package]
name = "siple-cli"
description = "Siple console binary: headless run, ctl client, MCP bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
siple-core = { path = "../siple-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "io-std", "fs", "sync"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
