[package]
name = "siple-media"
description = "RTP/SRTP/codec/SDP/jitter-buffer primitives for Siple (no I/O, no async)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.23"
rand = "0.10"

# Codecs
ezk-g722 = "0.1"
# Static libopus built from bundled source (needs cmake); no runtime DLL.
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "static", "bundled"] }

# SRTP crypto primitives
aes = "0.9"
ctr = "0.10"
hmac = "0.13"
sha1 = "0.11"
subtle = "2.6"
zeroize = "1.8"
