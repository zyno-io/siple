[package]
name = "siple-core"
description = "Siple engine: config, SIP, media engine, audio, control API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Mac App Store / Microsoft Store builds: compiles out only the GitHub update source (its API
# request and releases parser) and, later, any downloader or installer. The store update checks
# stay: the App Store lookup, and the Microsoft Store query (`windows`, Windows only). See
# docs/RELEASING.md.
store = ["dep:windows"]

[dependencies]
siple-config = { path = "../siple-config" }
siple-sip = { path = "../siple-sip" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "7"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
toml = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "std"] }

arc-swap = "1"
cpal = "0.18"
ringbuf = "0.5"
rubato = "5"

siple-media = { path = "../siple-media" }
anyhow = "1"
base64 = "0.22"
unicode-general-category = "1"
tempfile = "3"
crossbeam-channel = "0.5"
hound = "3.5"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util", "process"] }
async-trait = "0.1"
tokio-util = "0.7"
# The update check's HTTPS GET (src/update/http.rs): the same rustls + ring + OS verifier stack as
# siple-sip, no OpenSSL, no HTTP client crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-platform-verifier = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
notify = "8"
notify-debouncer-full = "0.6"
minisign-verify = { version = "0.3", default-features = false }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Real-time promotion of the media thread; Linux uses libc SCHED_RR instead
# (the crate's default dbus feature would hard-link libdbus-1).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
audio_thread_priority = "0.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"

[target.'cfg(windows)'.dependencies]
# The Microsoft Store update query (src/update/msstore.rs), store builds only.
windows = { version = "0.62", optional = true, features = ["ApplicationModel", "Services_Store", "Foundation_Collections"] }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = "0.3"

[dev-dependencies]
rsipstack = { path = "../../vendor/rsipstack", default-features = false, features = ["platform-tokio", "rustls", "srv_lookup"] }
keyring-core = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
