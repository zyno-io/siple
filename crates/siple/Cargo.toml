[package]
name = "siple"
description = "Siple GUI binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Store builds (Mac App Store, Microsoft Store): no GitHub update source (the store check and its
# store-link offer stay). See docs/RELEASING.md.
store = ["siple-core/store"]

[dependencies]
siple-core = { path = "../siple-core" }
siple-sip = { path = "../siple-sip" }
siple-media = { path = "../siple-media" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# Snapshot tests of the views (tests/snapshots/*.png), rendered headless with wgpu.
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }

# Linux: load libwayland/xkbcommon at runtime instead of linking them (keeps
# `--headless` runnable without GUI libraries). Same winit as eframe.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita-notitle"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }

# Tray icon + native menus (NSStatusItem / Shell_NotifyIcon). Not used on Linux: its tray backend
# links GTK + libappindicator, which breaks the "no GUI libraries linked" rule; Linux uses ksni
# (StatusNotifierItem over zbus) instead.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSOperation", "NSError", "NSArray", "NSDictionary", "NSValue", "objc2-core-services"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace", "block2"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSettings", "UNNotification", "UNNotificationTrigger", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.55"
notify-rust = { version = "4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies.ksni]
version = "0.3"

# Windows-only: embeds manifest + icon (see build.rs). Not compiled on other hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
