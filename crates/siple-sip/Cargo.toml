[package]
name = "siple-sip"
description = "Siple SIP foundation: accounts, transports, registration, incoming-request router (on vendored rsipstack)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
siple-config = { path = "../siple-config" }
siple-media = { path = "../siple-media" }
rsipstack = { path = "../../vendor/rsipstack", default-features = false, features = ["platform-tokio", "rustls", "srv_lookup"] }

anyhow = "1"
async-trait = "0.1"
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hickory-resolver = { version = "0.26", features = ["system-config", "tokio"] }
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

# OS network-change watchers (src/net/os_*.rs); all already in the dependency graph, no shared
# libraries beyond libc on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
