# cargo-deny configuration. Run: cargo deny check licenses   (or just: cargo deny check)
# Policy: permissive dependency licenses only; no OpenSSL anywhere (TLS is rustls + ring).
# Our own crates are FSL-1.1-ALv2 (source-available); they are `publish = false`, so the
# [licenses.private] ignore below skips them without widening the dependency allow-list.

[graph]
# The shipped targets. (Windows crates are only checked if their target is listed.)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",     # audio_thread_priority (file-level copyleft; used unmodified)
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",          # fonts bundled by egui (epaint_default_fonts), together with:
    "Ubuntu-font-1.0",  # (same crate; font licenses, not linked code)
]

# Per-crate exceptions: visible and deliberate, never part of the general allowlist.
exceptions = [
    # ksni (StatusNotifierItem tray over zbus, Linux): the Unlicense is OSI-approved public-domain
    # dedication; kept out of the general allowlist.
    { allow = ["Unlicense"], crate = "ksni" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Unmaintained notices for every crate in the graph, not just our own: cargo-deny 0.22 changed the
# default to "workspace", which would silently drop the transitive notices ignored below.
unmaintained = "all"
# Deliberate, reviewed exceptions only. Each needs a reason and an exit condition.
ignore = [
    # chrono declared unmaintained (2026-09-14, no vulnerability). Only Siple's own crates use it
    # (timestamps, RFC 3339 formatting). Remove once migrated to jiff (docs/TODO.md).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice only; migration to jiff tracked in TODO" },
    # zbus 5.x helper crates (merged into zbus 6), Linux only: pulled in by egui -> accesskit_unix
    # -> atspi (screen-reader support, needed for accessibility), ksni (tray) and keyring ->
    # secret-service. "Unmaintained" notices, not vulnerabilities. Remove once accesskit_unix/atspi,
    # ksni and secret-service move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit_unix; unmaintained notice only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit_unix; unmaintained notice only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit_unix; unmaintained notice only" },
]
