# cargo-about configuration: generates THIRD-PARTY-NOTICES.html for binary distributions.
#   scripts/gen-licenses.sh        (needs: cargo install cargo-about --locked)
#
# `accepted` MUST stay identical to [licenses].allow in deny.toml; `cargo deny check licenses`
# is the gate, this list only has to cover the same set so generation never fails on a crate
# deny accepted.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Our own crates (FSL-1.1-ALv2, `publish = false`) are not third-party; same as
# `[licenses.private] ignore = true` in deny.toml.
private = { ignore = true }

# Same shipped targets as deny.toml.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Test-only crates are not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

# Per-crate exception, same as the `ksni` entry in deny.toml's [licenses].exceptions
# (the Linux tray crate; Unlicense stays out of the general list).
[ksni]
accepted = ["Unlicense"]
