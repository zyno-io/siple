name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Include how it should look in the GUI and how an agent or script would use it (JSON-RPC method / MCP tool). New features ship with both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: textarea
    id: standards
    attributes:
      label: Relevant RFCs or PBX behaviour
      description: Optional. For protocol features, the RFC section or the PBX/phone that does it.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to send a pull request
