name: Website

# Builds the Astro marketing site in sites/www/ and publishes it to ZynoHosting.
#   - www-staging.siple.app (alpha cluster): automatically on every push to main.
#   - siple.app (production): when a stable GitHub release is published (release.yml uploads a draft; publishing it
#     by hand fires `release: published`). The site is built from the release's tag. Manually: Actions > Website > Run workflow from main or a stable tag (v1.2.3), target =
#     production (e.g. a copy fix between releases).
#     Before deploying, the job checks that the CHANGELOG version matches the tag and that every download link in
#     the built page is live, so siple.app never links to a draft or missing asset.
#     The build also writes the app's update feed (/updates/v1/releases.json, scripts/update-feed.mjs) from the
#     GitHub releases list. On a release build it fails unless the newest stable release in the feed is the tag, so
#     a production deploy always carries the release that was just published.
#   - A published release candidate (`release: published`, prerelease) also redeploys production, so the update feed
#     lists it at once (the app's prerelease channel reads the feed). The site is built from the source of the latest
#     stable tag, not from the candidate's, so the page's download links and text stay on the stable release; only
#     the feed (fetched live) gains the candidate. The latest stable tag must already carry the feed script. Its
#     deploy has its own concurrency group, so it can never replace a pending stable deploy, and it re-checks that
#     no newer stable release appeared while it ran.
# Pull requests only build the site; they never deploy.
#
# Each deploy job reads ZYNOHOSTING_DEPLOY_TOKEN from its GitHub environment (www-staging, www-production).
# A deploy token can deploy one site and nothing else. Create or rotate one with
#   zynohosting deploy-tokens create <site> --production --github zyno-io/siple --github-environment <env>
# (add --environment alpha for www-staging). Never use a tenant API key here.
# The CLI and its dependency tree are pinned by sites/www/deploy/package-lock.json.

on:
  push:
    branches: [main]
    # CHANGELOG.md: the site reads the released version and date from it (src/data/release.ts).
    paths:
      - 'sites/www/**'
      - 'CHANGELOG.md'
      - '.github/workflows/www.yml'
  pull_request:
    paths:
      - 'sites/www/**'
      - 'CHANGELOG.md'
      - '.github/workflows/www.yml'
  # Not a tag push: assets only become public when the draft release is published, ~20 minutes after the tag.
  # A published release candidate refreshes the update feed on production (see above).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# One run per ref and target: a newer push supersedes a queued staging deploy (so staging never ends up on an
# older commit), and never cancels a pending production dispatch. PR runs cancel their stale builds.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('www-pr-{0}', github.ref) || format('www-{0}-{1}', github.ref, inputs.target || (github.ref_type == 'tag' && 'production' || 'staging')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    # A published release candidate builds the latest stable tag (its own tag, v0.3.0-rc.1, isn't a CHANGELOG
    # version), so that the feed lists it while the page stays on the stable release.
    if: >-
      github.event_name != 'release' || github.event.release.prerelease ||
      (!github.event.release.prerelease && !contains(github.event.release.tag_name, '-'))
    runs-on: ubuntu-latest
    outputs:
      # Set on a release candidate run: the stable tag the site was built from.
      stable-tag: ${{ steps.src.outputs.ref }}
    env:
      # @playwright/test (VRT, local only) is a devDependency; the build never needs its browsers.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Release and tag builds: src/data/release.ts fails the build unless the newest CHANGELOG version is this tag.
      # (A release candidate run replaces it with the stable tag it builds, in the Build step.)
      SIPLE_EXPECT_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - name: Find the latest stable tag (release candidate runs)
        id: src
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Published, not a draft, not a pre-release, a plain vX.Y.Z tag; the highest version wins.
          tag=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                  --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          [ -n "$tag" ] || { echo "::error::no stable release found to build the site from"; exit 1; }
          echo "release candidate ${{ github.event.release.tag_name }}: building the site from the latest stable tag $tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty (the event's own ref) except on a release candidate run.
          ref: ${{ steps.src.outputs.ref }}
      - name: Check the stable tag carries the feed script
        if: steps.src.outputs.ref != ''
        run: |
          [ -f sites/www/scripts/update-feed.mjs ] || { echo "::error::${{ steps.src.outputs.ref }} predates the update feed; nothing to refresh until a stable release includes it"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sites/www/.nvmrc
          cache: npm
          cache-dependency-path: sites/www/package-lock.json
      - name: Install
        working-directory: sites/www
        run: npm ci
      - name: Self-check the update feed script
        working-directory: sites/www
        run: npm run feed:test
      - name: Build
        working-directory: sites/www
        # GITHUB_TOKEN (contents: read) lifts the API rate limit of the update feed fetch (scripts/update-feed.mjs).
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # On a release candidate run the CHANGELOG is the stable tag's: the feed's newest stable must be that tag.
          SIPLE_EXPECT_VERSION: ${{ steps.src.outputs.ref || env.SIPLE_EXPECT_VERSION }}
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: www-dist
          path: sites/www/dist
          if-no-files-found: error
          # deploy mirrors dist/ exactly: a dropped dotfile (.well-known/...) would be deleted from the site.
          include-hidden-files: true
          retention-days: 1

  deploy-staging:
    name: deploy (www-staging.siple.app)
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    runs-on: ubuntu-latest
    environment:
      name: www-staging
      url: https://www-staging.siple.app
    # A newer run must never cancel a deploy halfway.
    concurrency:
      group: www-deploy-staging
      cancel-in-progress: false
    steps:
      # The CLI and its whole dependency tree come from sites/www/deploy/package-lock.json, installed
      # without lifecycle scripts, since this job holds the deploy token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: sites/www/deploy
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sites/www/deploy/.nvmrc
      - name: Install the ZynoHosting CLI
        working-directory: sites/www/deploy
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www-dist
          path: dist
      - name: Deploy
        env:
          ZYNOHOSTING_DEPLOY_TOKEN: ${{ secrets.ZYNOHOSTING_DEPLOY_TOKEN }}
        run: sites/www/deploy/node_modules/.bin/zynohosting deploy www-staging.siple.app ./dist --yes --environment alpha

  deploy-production:
    name: deploy (siple.app)
    needs: build
    # A published stable release (its tag has no "-", so no v1.2.3-rc.1), a published release candidate (the build
    # is the latest stable tag's, refreshing the feed), or a manual run from main or a stable tag.
    # A manual run from main while main's CHANGELOG names an unreleased version stops at the link check below.
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft &&
       startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      (github.event_name == 'release' && github.event.release.prerelease && !github.event.release.draft &&
       startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' &&
       (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))))
    runs-on: ubuntu-latest
    environment:
      name: www-production
      url: https://siple.app
    # A queued run replaces an older queued one in the same group, so release candidate deploys get their own group:
    # they can never cancel a pending stable deploy (the stable group also serves manual runs).
    concurrency:
      group: ${{ github.event_name == 'release' && github.event.release.prerelease && 'www-deploy-production-rc' || 'www-deploy-production' }}
      cancel-in-progress: false
    steps:
      # The CLI and its whole dependency tree come from sites/www/deploy/package-lock.json, installed
      # without lifecycle scripts, since this job holds the deploy token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: sites/www/deploy
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sites/www/deploy/.nvmrc
      - name: Install the ZynoHosting CLI
        working-directory: sites/www/deploy
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www-dist
          path: dist
      - name: Check no newer stable release appeared (release candidate runs)
        if: needs.build.outputs.stable-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT: ${{ needs.build.outputs.stable-tag }}
        run: |
          set -euo pipefail
          # A stable release published meanwhile has its own deploy; this older build must not overwrite it.
          now=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                  --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          [ "$now" = "$BUILT" ] || { echo "::error::the latest stable release is now ${now:-unknown}, not $BUILT; not deploying (the stable release's own run deploys)"; exit 1; }
      - name: Check every download link is live
        # A draft release's assets 404; never publish a page whose buttons are broken.
        run: |
          set -euo pipefail
          urls=$(grep -oE 'https://github\.com/zyno-io/siple/releases/download/[^"<> ]+' dist/index.html | sort -u || true)
          [ -n "$urls" ] || { echo "::error::no release download links in dist/index.html"; exit 1; }
          bad=0
          for u in $urls; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors "$u" || true)
            echo "$code $u"
            [ "$code" = 200 ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::some download links are not live (unpublished release or missing asset); not deploying"; exit 1; }
      - name: Check the update feed carries this release
        run: |
          set -euo pipefail
          feed=dist/updates/v1/releases.json
          [ -s "$feed" ] || { echo "::error::$feed is missing from the build"; exit 1; }
          # The newest stable release in the feed must be the one the site links (the release.yml tag on a release run).
          want=$(grep -oE 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/' dist/index.html | head -n1 | sed -E 's#releases/download/(v[^/]+)/#\1#')
          [ -n "$want" ] || { echo "::error::no release version found in dist/index.html"; exit 1; }
          jq -e --arg want "$want" '[.[] | select(.prerelease == false and .draft == false)] | sort_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber)) | last | .tag_name == $want' "$feed" > /dev/null \
            || { echo "::error::the newest stable release in the update feed is not $want"; exit 1; }
          echo "update feed ok: newest stable is $want"
      - name: Deploy
        env:
          ZYNOHOSTING_DEPLOY_TOKEN: ${{ secrets.ZYNOHOSTING_DEPLOY_TOKEN }}
        run: sites/www/deploy/node_modules/.bin/zynohosting deploy siple.app ./dist --yes
