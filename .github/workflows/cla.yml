# Contributor License Agreement (CLA.md): asks first-time contributors to sign by commenting on
# their pull request and records signatures in signatures/cla.json on the `cla-signatures` branch.
#
# pull_request_target runs in the context of the base repository so it can comment and write the
# signature file for pull requests from forks. It never checks out or runs pull request code: the
# only step is the pinned CLA action, which reads PR metadata and comments through the API.
# The action identifies a commit by its GitHub login, or by the git author name when the email is
# not linked to an account; before merging, check the PR author appears in signatures/cla.json.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write # re-run the failed check after a signature comment
  contents: write # commit to the cla-signatures branch
  pull-requests: write # comment on the pull request

jobs:
  cla:
    name: CLA signed
    # Comments: only the sign / recheck phrases on pull requests.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Siple CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    # Job level, so comments whose job is skipped never cancel a pending check.
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/zyno-io/siple/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Must exist (an orphan branch, outside any branch ruleset); see docs/RELEASING.md.
          branch: cla-signatures
          # No allowlist: the action matches it against the git author *name* for commits whose
          # email is not linked to a GitHub account, so anyone could claim an allowlisted name.
          # Maintainers sign once like everyone else.
          custom-pr-sign-comment: I have read the Siple CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read the
            [Siple Contributor License Agreement](https://github.com/zyno-io/siple/blob/main/CLA.md)
            and sign it by posting a comment with exactly the sentence below. You only need to do
            this once; it covers all your future contributions to Siple.
          custom-allsigned-prcomment: All contributors have signed the Siple CLA. Thank you.
          lock-pullrequest-aftermerge: false
