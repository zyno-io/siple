[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/rsipstack"]

[workspace.package]
version = "0.2.10"
edition = "2024"
rust-version = "1.94"
license = "FSL-1.1-ALv2"
publish = false

[profile.release]
lto = "thin"

# Build scripts and proc macros: never strip. On macOS 27 the default release stripping leaves
# proc-macro dylibs the loader rejects ("mis-aligned LINKEDIT string pool"), so release builds fail
# with "can't find crate for `thiserror_impl`".
[profile.release.build-override]
strip = false

# winit 0.30.13 (e9809ef) plus two commits on branch siple/0.30.13 of the fork: the private
# CGSMainConnectionID / CGSSetWindowBackgroundBlurRadius calls are removed and macOS set_blur is a
# no-op (App Review rejects the symbol; Siple never requests blur), and dpi comes from crates.io as in
# the published crate. Drop once the winit that eframe uses no longer references the symbol. The same
# URL is allowed in deny.toml ([sources] allow-git) and scripts/flatpak-cargo-check.py (GIT_ALLOWED).
[patch.crates-io]
winit = { git = "https://github.com/zynoconsulting/winit", rev = "8828032943d6d07b75ff498bfd644ee7d2690741" }
