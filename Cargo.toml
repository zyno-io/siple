[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/rsipstack", "vendor/winit"]

[workspace.package]
version = "0.2.10"
edition = "2024"
rust-version = "1.94"
license = "FSL-1.1-ALv2"
publish = false

[profile.release]
lto = "thin"

# Build scripts and proc macros: never strip. On macOS 27 the default release stripping leaves
# proc-macro dylibs the loader rejects ("mis-aligned LINKEDIT string pool"), so release builds fail
# with "can't find crate for `thiserror_impl`".
[profile.release.build-override]
strip = false

# winit 0.30.13 with the private CGSSetWindowBackgroundBlurRadius call removed (Mac App Store
# rejects it). Drop once eframe's winit no longer references it. See vendor/winit/SIPLE_PATCHES.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
